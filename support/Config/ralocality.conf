10.0.0.0/8-10.255.255.255/32    2               Company
10.144.0.0/16-10.144.255.255/32 3               Organization
11.0.0.0/8-192.167.255.255/32   1               Internet                // Internet
192.168.0.0/24                  4               Wired           1       // Wired
192.168.0.67                    4               SMTP            3       // SMTP
192.168.1.0/24                  4               Remote		1       // Remote
192.168.2.0/24                  4               Wireless        2       // Wireless
207.237.36.98                   2               Exterior        18
192.168.3.0/24-223.0.0.0/8      1		Internet

224.0.0.0/24                    4               Local           1       // local subnetwork Multicast
224.0.1.0/24                    3               Inter           1       // internetwork Multicast
224.0.2.0-224.0.255.255         1               Global          1       // Globally routed Multicast
224.3.0.0-224.4.255.255         1               Global          1       // Globally routed Multicast

