name: CI

# Runs on GitHub-hosted runners (not the local machine) on every push and
# pull request against main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Doesn't need to write anything (no releases, no PR comments, no pushing
# tags) -- explicitly restrict the GITHUB_TOKEN to read-only rather than
# relying on the repository's default token permissions.
permissions:
  contents: read

# If new commits land on the same branch/PR while a run is still in
# progress, cancel the older run instead of letting both finish --
# avoids wasting Actions minutes on superseded commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison flex zlib1g-dev libreadline-dev libncurses-dev \
            libmaxminddb-dev libsasl2-dev uuid-dev default-libmysqlclient-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install zlib readline libmaxminddb mysql-client

      - name: Configure
        run: ./configure

      - name: Build
        run: make -j4
